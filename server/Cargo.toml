[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
shared = { path = "../shared" }
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.7", features = ["cors"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
automerge = "0.11"
